<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하반기 제자반 신청 · 온누리교회 소년부</title>
<style>
  :root{
    --ink:#1B2A4A;
    --indigo:#2D4373;
    --gold:#B8883A;
    --paper:#FBF9F5;
    --card:#FFFFFF;
    --line:#E4DED2;
    --muted:#6B6B63;
    --alert:#A83A31;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Pretendard,"Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-text-size-adjust:100%;
  }

  .wrap{max-width:560px;margin:0 auto;padding:0 20px 72px}

  /* ── 상단 밴드 ───────────────────────────── */
  .band{
    background:var(--ink);
    color:#fff;
    margin:0 -20px 28px;
    padding:calc(40px + env(safe-area-inset-top,0px)) 24px 36px;
  }
  .band .church{
    font-size:13px;
    letter-spacing:.04em;
    color:#A9B6D0;
    margin:0 0 6px;
  }
  .band h1{
    font-size:18px;
    font-weight:500;
    margin:0 0 20px;
    color:#DDE4F0;
  }
  .band .theme{
    font-size:32px;
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.25;
    margin:0;
  }
  .band .rule{
    width:44px;height:2px;
    background:var(--gold);
    margin:18px 0 0;
  }

  /* ── 카드 ────────────────────────────────── */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px;
    margin-bottom:24px;
  }
  .card h2{
    font-size:15px;
    font-weight:700;
    margin:0 0 16px;
    color:var(--indigo);
  }

  /* 안내 정보 */
  dl.info{margin:0}
  dl.info>div{
    display:flex;
    gap:14px;
    padding:11px 0;
    border-top:1px solid var(--line);
  }
  dl.info>div:first-child{border-top:0;padding-top:0}
  dl.info dt{
    flex:0 0 58px;
    font-size:14px;
    color:var(--muted);
    font-weight:500;
  }
  dl.info dd{margin:0;font-size:15px;flex:1}
  dl.info .note{
    display:block;
    font-size:13px;
    color:var(--alert);
    margin-top:3px;
  }
  dl.info .subline{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }
  .open-note{
    margin:16px 0 0;
    padding:11px 13px;
    background:#F2F4F9;
    border-left:3px solid var(--indigo);
    font-size:14px;
    color:var(--indigo);
    font-weight:500;
  }

  /* ── 폼 ─────────────────────────────────── */
  .field{margin-bottom:22px}
  .field:last-of-type{margin-bottom:0}

  label.lab,legend.lab{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    padding:0;
  }
  .req{color:var(--alert);margin-left:3px}
  .opt{color:var(--muted);font-weight:400;margin-left:4px;font-size:13px}

  input[type=text],input[type=tel]{
    width:100%;
    font:inherit;
    font-size:16px;
    padding:12px 13px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--ink);
  }
  input::placeholder{color:#B5B0A6}
  input:focus-visible,
  input[type=radio]:focus-visible+span,
  input[type=checkbox]:focus-visible+span,
  button:focus-visible,
  summary:focus-visible{
    outline:2px solid var(--indigo);
    outline-offset:2px;
  }
  input.bad{border-color:var(--alert)}

  .err{
    display:none;
    font-size:13px;
    color:var(--alert);
    margin-top:6px;
  }
  .err.on{display:block}

  fieldset{border:0;margin:0;padding:0}
  .radios{display:flex;gap:7px}
  .radios label{
    flex:1;
    display:block;
    position:relative;
  }
  .radios input{
    position:absolute;
    opacity:0;
    width:100%;height:100%;
    margin:0;
    cursor:pointer;
  }
  .radios span{
    display:block;
    text-align:center;
    padding:12px 4px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    font-size:14.5px;
    white-space:nowrap;
  }
  .radios input:checked+span{
    border-color:var(--indigo);
    background:var(--indigo);
    color:#fff;
    font-weight:600;
  }

  /* 개인정보 동의 */
  details.privacy{
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    margin-bottom:12px;
  }
  details.privacy summary{
    padding:12px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    list-style:none;
  }
  details.privacy summary::-webkit-details-marker{display:none}
  details.privacy summary::after{
    content:"펼치기";
    float:right;
    font-weight:400;
    color:var(--muted);
    font-size:13px;
  }
  details.privacy[open] summary::after{content:"접기"}
  .privacy-body{
    padding:0 14px 14px;
    font-size:14px;
    color:#4A4A44;
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .privacy-body dl{margin:0}
  .privacy-body dt{font-weight:600;margin-top:10px}
  .privacy-body dt:first-child{margin-top:0}
  .privacy-body dd{margin:2px 0 0}
  .privacy-body p{margin:12px 0 0;color:var(--muted);font-size:13px}

  label.agree{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:15px;
    cursor:pointer;
  }
  label.agree input{
    width:19px;height:19px;
    accent-color:var(--indigo);
    margin:0;
    flex:0 0 auto;
  }

  /* 제출 */
  .submit{
    width:100%;
    font:inherit;
    font-size:17px;
    font-weight:700;
    color:#fff;
    background:var(--indigo);
    border:0;
    border-radius:4px;
    padding:16px;
    margin-top:28px;
    cursor:pointer;
  }
  .submit:disabled{
    background:#C6C2B8;
    cursor:not-allowed;
  }
  .hint{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin:10px 0 0;
  }
  .formerr{
    display:none;
    margin-top:14px;
    padding:12px 14px;
    background:#FBEEED;
    border:1px solid #E8C9C6;
    border-radius:4px;
    font-size:14px;
    color:var(--alert);
  }
  .formerr.on{display:block}

  /* 완료 화면 */
  #done{display:none;text-align:center;padding:40px 22px}
  #done .mark{
    width:52px;height:52px;
    margin:0 auto 18px;
    border-radius:50%;
    background:var(--indigo);
    display:flex;align-items:center;justify-content:center;
  }
  #done .mark svg{width:24px;height:24px}
  #done h2{font-size:19px;margin:0 0 8px;color:var(--ink)}
  #done p{margin:0;color:var(--muted);font-size:15px}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="band">
    <p class="church">온누리교회 소년부</p>
    <h1>하반기 제자반 신청</h1>
    <p class="theme">예배하는<br>다윗학교</p>
    <div class="rule"></div>
  </header>

  <section class="card" aria-labelledby="info-h">
    <h2 id="info-h">안내</h2>
    <dl class="info">
      <div><dt>대상</dt><dd>소년 1·2부 전체 및 교사</dd></div>
      <div><dt>인원</dt><dd>최대 50명 (예정)</dd></div>
      <div><dt>일시</dt><dd>매주 토요일 14:00~16:00 · 총 4주</dd></div>
      <div><dt>기간</dt><dd>10월 17일 ~ 11월 14일<span class="note">11월 7일은 졸업여행으로 쉽니다</span></dd></div>
      <div><dt>회비</dt><dd>학생 2만원</dd></div>
      <div><dt>계좌</dt><dd>카카오뱅크 3333-3303-22899<span class="subline">예금주 박지혜</span></dd></div>
      <div><dt>장소</dt><dd>인천온누리교회 2층 기쁨홀</dd></div>
    </dl>
  </section>

  <section class="card" id="closed" aria-live="polite">
    <h2>신청이 마감되었습니다</h2>
    <p>제자반 신청은 마감되어 더 이상 받지 않습니다. 문의는 소년부 교사에게 해 주세요.</p>
  </section>

</div>
</body>
</html>
